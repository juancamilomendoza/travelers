<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pa Donde Vamos: tú pones las ganas, nosotros el plan. Cuéntanos tu presupuesto y te sugerimos destinos con hospedaje, actividades, movilidad y alimentación." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pa Donde Vamos</title>
    <script>
      try {
        var t = localStorage.getItem("travelers-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
